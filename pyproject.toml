[tool.poetry]
name = "metrocode"
version = "0.1.1"
description = "Transforme seu código Python em um mapa interativo no terminal — igual ao mapa do metrô de São Paulo."
authors = ["RhogarDarkmor"]
license = "MIT"
readme = "README.md"
packages = [
  { include = "metrocode", from = "src" }
]

[tool.poetry.scripts]
metrocode = "metrocode.app:main"

[tool.poetry.dependencies]
python = "^3.11"
textual = "^0.40.0"
networkx = "^3.0"
numpy = "^2.4.6"
scipy = "^1.17.1"
matplotlib = "^3.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.1.0"
ruff = "^0.3.0"
black = "^24.3.0"
isort = "^5.12.0"
mypy = "^1.7.1"
pre-commit = "^3.5.0"
types-networkx = "^3.0"


[tool.ruff]
line-length = 88
extend-select = ["E", "W", "F", "I", "B"]
exclude = [".venv", "build", "dist", "__pycache__"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["metrocode"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/metrocode"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
precision = 2

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
exclude = [".venv", "build", "dist"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"