[tool.poetry]
name = "metrocode"
version = "0.1.1"
description = "Transforme seu código Python em um mapa interativo no terminal — igual ao mapa do metrô de São Paulo."
authors = ["RhogarDarkmor"]
license = "MIT"
readme = "README.md"
packages = [
  { include = "metrocode", from = "src" }
]

[tool.poetry.scripts]
metrocode = "metrocode.app:main"

[tool.poetry.dependencies]
python = "^3.11"
textual = "^0.40.0"
networkx = "^3.0"
numpy = "^2.4.6"
scipy = "^1.17.1"
matplotlib = "^3.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.3.0"

[tool.ruff]
line-length = 88
extend-select = ["E", "W", "F", "I", "B"]
exclude = [".venv", "build", "dist", "__pycache__"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"