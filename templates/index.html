<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MetroCode</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin:0; background:#0d1117; font-family:Segoe UI,sans-serif; overflow:hidden; }
        #loading { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:30px; }
        .loader { width:60px; padding:8px; aspect-ratio:1; border-radius:50%; background:#0055FF;
            --_m: conic-gradient(#0000 10%,#000), linear-gradient(#000 0 0) content-box;
            -webkit-mask:var(--_m); mask:var(--_m); -webkit-mask-composite:source-out; mask-composite:subtract;
            animation: l3 1s infinite linear, colorShift 10s infinite ease-in-out alternate; }
        @keyframes l3 { to{transform:rotate(1turn)} }
        @keyframes colorShift { 0%{background:#0055FF} 20%{background:#00CC44} 40%{background:#FF0044} 60%{background:#FFCC00} 80%{background:#C084FC} 100%{background:#C0C0C0} }
        .status { color:#c9d1d9; font-size:1.2rem; }
        .status span { color:#58a6ff; font-weight:bold; }
        #map { display:none; width:100%; height:100vh; }
        svg { width:100%; height:100%; background:#1a1e24; }
        .estacao circle { cursor:pointer; transition:r 0.2s; }
        .estacao circle:hover { r:14; }
        .tooltip { position:absolute; background:#2d333b; color:#c9d1d9; padding:8px 12px; border-radius:8px; font-size:0.9rem; pointer-events:none; opacity:0; transition:opacity 0.2s; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loader"></div>
        <div class="status">Analisando código e construindo <span>MetroCode</span>...</div>
    </div>
    <div id="map">
        <svg id="metro-svg"></svg>
        <div class="tooltip" id="tooltip"></div>
    </div>
    <script>
        window.addEventListener('load', ()=>{
            if(window.pywebview) {
                pywebview.api.processar_pasta().then(data=>{
                    document.getElementById('loading').style.display='none';
                    document.getElementById('map').style.display='block';
                    const svg=d3.select("#metro-svg"), tooltip=d3.select("#tooltip");
                    const w=document.getElementById('map').clientWidth, h=document.getElementById('map').clientHeight;
                    svg.attr("viewBox",[0,0,w,h]);
                    const g=svg.append("g");
                    svg.call(d3.zoom().scaleExtent([0.3,2]).on("zoom",e=>g.attr("transform",e.transform)));
                    const estMap=new Map(data.estacoes.map(e=>[e.id,e]));
                    g.selectAll(".aresta").data(data.arestas).enter().append("path")
                      .attr("d",d=>{let a=estMap.get(d.de),b=estMap.get(d.para); if(!a||!b)return""; let dx=b.x-a.x,dy=b.y-a.y,dr=Math.sqrt(dx*dx+dy*dy)*1.5; return `M${a.x},${a.y}A${dr},${dr} 0 0,1 ${b.x},${b.y}`})
                      .attr("fill","none").attr("stroke",d=>d.tipo==="baldeacao"?"#f0f0f0":estMap.get(d.de).cor_linha)
                      .attr("stroke-width",d=>d.tipo==="baldeacao"?2.5:4).attr("stroke-dasharray",d=>d.tipo==="baldeacao"?"8,4":"none").attr("opacity",0.8);
                    const estG=g.selectAll(".estacao").data(data.estacoes).enter().append("g").attr("transform",d=>`translate(${d.x},${d.y})`);
                    estG.append("circle").attr("r",12).attr("fill","#fff").attr("stroke",d=>d.cor_linha).attr("stroke-width",4);
                    estG.append("text").attr("dy",-18).attr("text-anchor","middle").attr("fill","#c9d1d9").style("font-size","0.7rem").text(d=>d.nome);
                    estG.on("mouseenter",(e,d)=>{tooltip.style("opacity",1).html(`<strong>${d.nome}</strong><br>${d.resumo}<br><em>${d.arquivo}</em>`)})
                         .on("mousemove",e=>{tooltip.style("left",(e.pageX+15)+"px").style("top",(e.pageY-30)+"px")})
                         .on("mouseleave",()=>tooltip.style("opacity",0));
                }).catch(e=>{ document.querySelector('.status').innerHTML=`<span style="color:#f85149;">Erro: ${e}</span>`; });
            } else { document.querySelector('.status').innerText="Execute pelo aplicativo MetroCode."; }
        });
    </script>
</body>
</html>
