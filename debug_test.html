
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <title>MetroCode - Teste</title>
        <style>
            body { background: #0d1117; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 20px; }
            .btn { padding: 15px 30px; background: #0055FF; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1.2rem; }
            .btn:hover { background: #0044CC; }
            #status { font-size: 1.1rem; color: #58a6ff; }
            pre { background: #1a1e24; padding: 20px; border-radius: 10px; max-width: 80%; overflow: auto; max-height: 400px; }
        </style>
    </head>
    <body>
        <h1>MetroCode</h1>
        <p id="status">Clique no botão para iniciar a análise</p>
        <button class="btn" onclick="iniciarAnalise()">Iniciar Análise</button>
        <pre id="resultado" style="display:none;"></pre>
        
        <script>
            async function iniciarAnalise() {
                document.getElementById('status').innerText = "Analisando... (verifique o terminal para logs)";
                try {
                    const dados = await pywebview.api.processar_pasta();
                    document.getElementById('status').innerText = "Análise concluída com sucesso!";
                    document.getElementById('resultado').style.display = 'block';
                    document.getElementById('resultado').textContent = JSON.stringify(dados, null, 2);
                } catch (erro) {
                    document.getElementById('status').innerHTML = `<span style="color:red;">Erro: ${erro}</span>`;
                }
            }
        </script>
    </body>
    </html>
